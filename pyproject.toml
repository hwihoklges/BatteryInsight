[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-insight-local"
version = "3.5.0"
description = "Auditable electrochemical data normalization, features and diagnostic evidence"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2", "pyarrow>=16", "scipy>=1.13", "openpyxl>=3.1", "cyc2parquet>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
sql = ["duckdb>=1.1"]
documents = ["python-pptx>=1.0", "pypdf>=6.18", "Pillow>=10"]

[project.scripts]
battery-insight = "battery_insight.unified_entry:main"

[tool.setuptools.packages.find]
include = ["battery_insight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
battery_insight = ["assets/*.js", "assets/*.css", "resources/*", "resources/catalog/*", "resources/catalog/all_metrics/*", "*.py"]
